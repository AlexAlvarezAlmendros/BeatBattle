# Calidad en cada PR y en cada push a main (guía §4.16): auditoría → Biome y lints propios → tipos →
# Vitest → build → Playwright (E2E, axe y «reducir movimiento», tarea 0.13). Las capturas de referencia
# por pantalla (§4.16 «Visual») llegan con las pantallas reales.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  # solo se cancelan las de una PR que recibe otro push; cada commit de main conserva su resultado
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # Con la Fase 1, los E2E pasan de 980 (unos 14 min en el runner) y la batería del motor de análisis
    # suma más de medio minuto: 20 min se quedaban cortos (la PR #5 se cortó en los E2E).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Sin `version`: instala la de `packageManager` del package.json raíz.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependencias de producción sin vulnerabilidades altas conocidas (guía §4.13).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # E2E con el Chromium de Playwright y sus dependencias del sistema. playwright.config.ts arranca la
      # web (Vite en desarrollo: la galería solo existe ahí) y la API con una BD temporal nueva.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: '1'
      # Si algo falla, las trazas del reintento (test-results/) para abrirlas con `playwright show-trace`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
